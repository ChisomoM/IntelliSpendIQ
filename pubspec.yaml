name: intellispendiq
description: AI-powered personal finance tracker capturing transactions from
  SMS alerts and voice. Offline-first, encrypted, Android-first.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  app_links: ^6.4.1
  bloc: ^9.0.1
  crypto: ^3.0.6
  drift: ^2.28.1
  equatable: ^2.0.7
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4
  http: ^1.4.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  path: ^1.9.0
  path_provider: ^2.1.5
  record: ^6.0.0
  sqlcipher_flutter_libs: ^0.6.7
  sqlite3: ^2.7.0
  uuid: ^4.5.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.28.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

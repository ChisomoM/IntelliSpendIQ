name: c_template_app
description: A Flutter template app with clean architecture using BLoC,
  repositories, and common features like authentication and theming.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  analytics_repository:
    path: packages/analytics_repository
  auth_repo:
    path: packages/auth_repo
  bloc: ^9.0.1
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.2.3
  uni_links: ^0.5.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  local_data:
    git:
      url: https://gitlab+deploy-token-4:4zjU2bJymy7c6vTztanf@gitlab.probasegroup.com/flutter_packages/local_data.git
      ref: 25bcb3354fc6171858c62e33d81410192458969f
  net_source:
    path: packages/net_source
  notifications_repo:
    path: packages/notifications_repo
  permission_client:
    path: packages/permission_client
  services_repo:
    path: packages/services_repo
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/json/
    - assets/images/

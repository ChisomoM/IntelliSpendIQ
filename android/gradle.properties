org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP's built-in Kotlin compilation is required by google_sign_in_android
# 7.2.17+ — that plugin only applies com.android.library and relies on AGP
# to compile its ResultUtils.kt itself. Disabling this (the Flutter
# migrator's default) leaves that file uncompiled and the plugin's Java
# code fails with "cannot find symbol ResultUtilsKt".
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
